<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1333" width="1000" height="1333">
  <defs>
    <linearGradient id="grad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="50%" stop-color="#282d3c" />
      <stop offset="100%" stop-color="#0c0d10" />
    </linearGradient>
    <radialGradient id="glow_05" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#cbb279" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#cbb279" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1333" fill="url(#grad_05)" />
  <circle cx="500" cy="500" r="450" fill="url(#glow_05)" />

  <!-- Frame Lines -->
  <rect x="40" y="40" width="920" height="1253" fill="none" stroke="#cbb279" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="56" y="56" width="888" height="1221" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#cbb279" stroke-width="2.5" />
  <path d="M 960 70 L 960 40 L 930 40" fill="none" stroke="#cbb279" stroke-width="2.5" />
  <path d="M 40 1263 L 40 1293 L 70 1293" fill="none" stroke="#cbb279" stroke-width="2.5" />
  <path d="M 960 1263 L 960 1293 L 930 1293" fill="none" stroke="#cbb279" stroke-width="2.5" />

  <!-- Center Graphic Element -->
  <g transform="translate(500, 500)" text-anchor="middle">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#cbb279" stroke-opacity="0.15" stroke-dasharray="4 8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="140" fill="rgba(255,255,255,0.02)" stroke="#cbb279" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- Camera/Portrait Silhouette Icon -->
    <path d="M -35 25 C -35 -15, 35 -15, 35 25 Z" fill="none" stroke="#cbb279" stroke-width="2" stroke-opacity="0.7" />
    <circle cx="0" cy="-30" r="22" fill="none" stroke="#cbb279" stroke-width="2" stroke-opacity="0.7" />
    
    <!-- Number Marker -->
    <text y="75" font-family="serif" font-size="14" fill="#cbb279" letter-spacing="6" opacity="0.9">PHOTO 05 OF 12</text>
  </g>

  <!-- Editorial Typographic Layout -->
  <g transform="translate(500, 860)" text-anchor="middle">
    <text font-family="serif" font-size="13" font-weight="400" fill="#cbb279" letter-spacing="8" opacity="0.85">NATURAL LIGHT</text>
    <text y="50" font-family="serif" font-style="italic" font-size="34" font-weight="300" fill="#ffffff" letter-spacing="2">The Grace in Laughter</text>
    <line x1="-60" y1="90" x2="60" y2="90" stroke="#cbb279" stroke-opacity="0.4" stroke-width="1" />
    <text y="130" font-family="sans-serif" font-size="12" fill="#8E929D" letter-spacing="4" text-transform="uppercase">Replace with photo-05.jpg</text>
  </g>

  <!-- Header & Footer Tags -->
  <text x="80" y="90" font-family="monospace" font-size="11" fill="#cbb279" letter-spacing="3" opacity="0.6">AYESHA · PORTFOLIO</text>
  <text x="920" y="90" font-family="monospace" font-size="11" fill="#cbb279" letter-spacing="3" text-anchor="end" opacity="0.6">03.09.2026</text>
  <text x="80" y="1255" font-family="monospace" font-size="10" fill="#8E929D" letter-spacing="2">SERIES REF: 2026.09.03-P05</text>
  <text x="920" y="1255" font-family="monospace" font-size="10" fill="#8E929D" letter-spacing="2" text-anchor="end">EDITORIAL ARCHIVE</text>
</svg>